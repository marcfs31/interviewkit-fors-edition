name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job declares its own permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: each merge commit keeps its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Lint (ruff check)
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: "0.17.0"
          src: backend

      - name: Format (ruff format --check)
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: "0.17.0"
          args: format --check
          src: backend

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # Needs the CODECOV_TOKEN repository secret; until it exists the upload
      # is skipped with a warning instead of failing the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  migrations:
    name: Migrations (alembic round trip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: interviewkit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d interviewkit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_APP: app:create_app()
      FLASK_ENV: development
      DATABASE_URL: postgresql://ci:ci@localhost:5432/interviewkit_ci
      SECRET_KEY: ci-dummy-secret-key
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-with-32-bytes-or-more
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GROQ_API_KEY: ci-dummy-groq-api-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upgrade to head
        run: flask db upgrade

      - name: Downgrade to base
        run: flask db downgrade base

      - name: Upgrade to head again
        run: flask db upgrade

      - name: Models match the migrations
        run: flask db check

      - name: Exactly one head
        run: |
          heads=$(flask db heads)
          printf '%s\n' "$heads"
          count=$(printf '%s\n' "$heads" | grep -c '(head)' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $count"
            exit 1
          fi

  frontend:
    name: Frontend (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Lint (next lint)
        run: npm run lint

      - name: Run tests
        run: npm test

      # next.config.mjs derives the CSP from NEXT_PUBLIC_API_URL and refuses
      # to build without a valid one; the value only has to parse here.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  version:
    name: Version (one version everywhere)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compare backend and frontend versions
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys

          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']\s*$',
              open("backend/app/version.py", encoding="utf-8").read(),
              re.MULTILINE,
          )
          package = json.load(open("frontend/package.json", encoding="utf-8"))
          lock = json.load(open("frontend/package-lock.json", encoding="utf-8"))
          versions = {
              "backend/app/version.py __version__": match.group(1) if match else None,
              "frontend/package.json version": package.get("version"),
              "frontend/package-lock.json version": lock.get("version"),
              'frontend/package-lock.json packages[""].version': lock.get("packages", {}).get("", {}).get("version"),
          }
          for source, version in versions.items():
              print(f"{version!r:>10}  {source}")
          if len(set(versions.values())) != 1 or None in versions.values():
              print("::error::The version must be identical in every manifest (and present in all of them).")
              sys.exit(1)
          print(f"All manifests agree on {next(iter(versions.values()))}.")
          PY

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action lists the commits of a pull request through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # The automatic per-run token, not a stored secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments: keeps the token read-only. Findings fail the job.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # The single required check for branch protection: a skipped or cancelled
  # job above would otherwise let a pull request through.
  results:
    name: results
    if: ${{ always() }}
    needs: [backend, migrations, frontend, version, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "$(printf '%s' "$NEEDS" | jq 'length')" -eq 0 ]; then
            echo "::error::No jobs to aggregate."
            exit 1
          fi
          failed=0
          while read -r job result; do
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done < <(printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
